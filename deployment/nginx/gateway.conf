# Edge nginx: the only container published to the host. Routes to the 3 services on the sprpa-net network.
# Docker's embedded DNS + variables: names are resolved per request, so nginx starts even if a service
# is down and follows containers when Jenkins recreates them with new IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;            # matches the 2 MB CSV limit
    server_tokens off;

    set $frontend sprpa-frontend:80;
    set $backend  sprpa-backend:4000;
    set $ml       sprpa-ml:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Express REST API
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://$backend;
        proxy_read_timeout 30s;
    }

    # ML service: only its health check is public. Model endpoints stay internal (backend -> ML).
    location = /ml/health {
        proxy_pass http://$ml/health;
    }
    location /ml/ { return 404; }

    # Gateway liveness for Jenkins smoke tests
    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # React app
    location / {
        proxy_pass http://$frontend;
    }
}
